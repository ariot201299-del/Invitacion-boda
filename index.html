<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Invitación de Boda</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(to bottom, #f8f6f2, #ffffff);
      color: #3a3a3a;
      text-align: center;
      animation: fadeIn 2s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .container {
      padding: 60px 20px;
      max-width: 500px;
      margin: auto;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 36px;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 18px;
      letter-spacing: 2px;
      margin-bottom: 40px;
    }

    .names {
      font-size: 32px;
      font-family: 'Playfair Display', serif;
      margin: 30px 0;
    }

    .details {
      font-size: 16px;
      line-height: 1.8;
      margin-bottom: 40px;
    }

    .footer {
      font-size: 14px;
      margin-top: 50px;
      color: #777;
    }

    .divider {
      width: 60px;
      height: 1px;
      background: #c2b8a3;
      margin: 30px auto;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Nos casamos</h2>

    <div class="names">
      Lorena & José
    </div>

    <div class="divider"></div>

    <div class="details">
      Con la bendición de Dios<br>
      y el amor de nuestras familias<br><br>

      Te invitamos a celebrar nuestra boda<br><br>

      <strong>Sábado 15 de Junio 2026</strong><br>
      5:00 p.m.<br><br>

      Hacienda San Rafael
    </div>

    <div class="divider"></div>

    <div class="footer">
      Tu presencia es nuestro mayor regalo
    </div>
  </div>

</body>
</html>
